services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - jarvis_qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis_data:/data

volumes:
  jarvis_qdrant_data:
  jarvis_redis_data: