services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - qdrant

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo -Q ingestion
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - qdrant

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-beat
    command: celery -A app.celery_app.celery_app beat --loglevel=info
    env_file:
      - .env.docker
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - qdrant

  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin
      POSTGRES_DB: jarvis_db
    ports:
      - "5432:5432"
    volumes:
      - jarvis_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: jarvis-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - jarvis_qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis_data:/data

volumes:
  jarvis_postgres_data:
  jarvis_qdrant_data:
  jarvis_redis_data: